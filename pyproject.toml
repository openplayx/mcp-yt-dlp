[project]
name = "openplayx-yt-dlp"
version = "0.1.0"
description = "OpenPlayX MCP service wrapping yt-dlp: inspect media URLs and download them on the server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Pinned upstream; the exact build is locked in uv.lock (see UPSTREAM.md).
    # "default" brings yt-dlp-ejs (YouTube JS challenges), "deno" the JS runtime.
    "yt-dlp[default,deno]==2026.10.26",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9",
]

[project.scripts]
openplayx-yt-dlp = "ytdlp_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdlp_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
